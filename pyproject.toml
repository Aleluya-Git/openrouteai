[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "openrouteai"
version = "0.6.3"
description = "Autorouter de PCB de código abierto para proyectos KiCad"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7"]

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
gpu = ["cupy-cuda12x[ctk]"]

[project.scripts]
openrouteai = "openrouteai.cli:main"

[tool.setuptools.packages.find]
include = ["openrouteai*"]

[tool.setuptools.package-data]
"openrouteai.routing" = ["_native/*.c", "_native/*.dll", "_native/*.so", "_native/*.dylib", "_native/build.sh"]
"openrouteai.gui" = ["resources/*.png", "resources/*.ico", "resources/icons/*.png"]
